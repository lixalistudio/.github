name: Bug report
description: Something does not work as documented
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Security problem?** Do not open an issue: follow the [security policy](https://github.com/lixalistudio/.github/blob/main/SECURITY.md).

        Remove every secret before posting: API keys, passwords, encryption keys, real email addresses.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, and what went wrong.
      placeholder: Submitting the form returns an error after the loader.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit.
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and error messages
      description: Paste them as text, with secrets removed.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Runtime: browser, Cloudflare Workers, local dev...
        - Version of Node.js, Bun or the browser
        - OS: macOS / Linux / Windows / Android / iOS
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues, and this is not a duplicate.
          required: true
        - label: I removed every secret and every piece of personal data from this report.
          required: true
